<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ダブルス対戦表アプリ 紹介</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #f7f7f7;
			margin: 0;
			padding: 0;
		}

		header {
			background-color: #1e88e5;
			color: white;
			padding: 2rem;
			text-align: center;
		}

		section {
			max-width: 800px;
			margin: 2rem auto;
			background-color: white;
			padding: 2rem;
			border-radius: 8px;
			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
		}

		h2 {
			color: #1e88e5;
		}

		ul {
			padding-left: 1.2rem;
		}

		li {
			margin-bottom: 1rem;
		}

		footer {
			text-align: center;
			color: #999;
			font-size: 0.9rem;
			padding: 1rem;
		}
	</style>
</head>

<body>
	<header>
		<h1>テニス・バドミントン・卓球に最適！<br>ダブルス組み合わせ表 & ランキング表示アプリ</h1>
	</header>

	<section>
		<h2>1. 様々な組み合わせに対応</h2>
		<ul>
			<li>プレイヤー数を自由に設定可能</li>
			<li>ペア固定やポジション固定の設定も簡単</li>
			<li>ダブルス形式に特化した柔軟なマッチング</li>
		</ul>

		<h2>2. ボタンひとつで試合結果をらくらく入力</h2>
		<ul>
			<li>試合後すぐにスコアを入力</li>
			<li>リアルタイムで組み合わせ表が更新</li>
			<li>誰でも直感的に操作できるインターフェース</li>
		</ul>

		<h2>3. ランキング表示</h2>
		<ul>
			<li>勝利数に応じて自動でランキング</li>
			<li>得失点差による詳細な順位表示</li>
			<li>試合の盛り上がりを可視化</li>
		</ul>
	</section>

	<footer>
		&copy; 2025 ダブルス対戦表アプリ
	</footer>
</body>

</html>
